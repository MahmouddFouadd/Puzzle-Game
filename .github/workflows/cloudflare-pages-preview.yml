name: Cloudflare Pages Preview (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: Choose preview-only to publish this feature branch to Cloudflare Pages.
        type: choice
        required: true
        default: NO
        options:
          - NO
          - PREVIEW ONLY

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feature/content-studio' && inputs.confirm_preview == 'PREVIEW ONLY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify required Actions secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and CLOUDFLARE_API_TOKEN as GitHub Actions secrets before running this preview workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build preview bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy feature branch to the non-production Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fb1570173b498e57f13159815f35340d
          command: pages deploy dist --project-name=puzzle-game --branch=feature-content-studio-preview
