name: Cloudflare Pages Production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Explicitly confirm a production deployment from main.
        type: choice
        required: true
        default: NO
        options:
          - NO
          - PUBLISH PRODUCTION
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production == 'PUBLISH PRODUCTION')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify required Actions secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and CLOUDFLARE_API_TOKEN as GitHub Actions secrets before deploying production."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Deploy to Cloudflare Pages production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fb1570173b498e57f13159815f35340d
          command: pages deploy dist --project-name=puzzle-game --branch=main
