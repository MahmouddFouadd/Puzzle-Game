name: Build Android APKs (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Supabase build secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository Actions secrets: VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build Admin debug APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VARIANT: admin
        run: |
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleAdminDebug --no-daemon)
          mkdir -p apk-artifacts
          admin_apk=$(find android/app/build/outputs/apk/admin/debug -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$admin_apk"
          cp "$admin_apk" apk-artifacts/Story-Puzzle-Admin-debug.apk
      - name: Build User debug APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VARIANT: user
        run: |
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleUserDebug --no-daemon)
          user_apk=$(find android/app/build/outputs/apk/user/debug -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$user_apk"
          cp "$user_apk" apk-artifacts/Story-Puzzle-User-debug.apk
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: story-puzzle-debug-apks
          path: apk-artifacts/*.apk
          if-no-files-found: error
